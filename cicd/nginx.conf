# Serve the SPA: static files with a fallback to index.html for client-side routes.
# /api is routed to the backend by the Ingress, so it never reaches nginx.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # index.html must NEVER be cached.
    #
    # Nothing here set Cache-Control before, and with no Cache-Control and no
    # Expires a browser is free to invent one -- the heuristic is a fraction of
    # the time since Last-Modified, which on a phone is easily hours. index.html
    # is the file that names the hashed bundles, so a stale copy pins the whole
    # app to an old build: deploys land, the served HTML still points at
    # yesterday's JS, and the driver sees changes that shipped days ago. That is
    # exactly what happened here, repeatedly, and it looked like the fixes had
    # not worked.
    # Same reasoning as index.html: a cached copy of the version marker would
    # tell the app it is up to date forever.
    location = /version.json {
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # The opposite problem, and the opposite answer. Vite fingerprints every
    # asset with a content hash, so a given URL's bytes can never change --
    # cache them for a year and let a new build produce new URLs.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
