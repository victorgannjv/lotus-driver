description: >
  Lotus Driver Tracking System tracks NinjaVan drivers delivering Lotus warehouse
  parcels across Kuala Lumpur. Drivers sign up and log in with email/password, then
  tap "Arrived at warehouse" to start a job (a driver may run 1-2 jobs a day) and scan
  each order's barcode to group it into that job; completing a delivery means scanning
  the barcode again, choosing Delivered or Failed (with a reason), and taking a proof
  photo -- every scan logs GPS + timestamp server-side, and the barcode itself is an
  exact identifier so there's no OCR or manual matching involved. The app notifies the
  driver once every order in a job is resolved. Supervisors use a Google-SSO-gated
  admin dashboard to review drivers, browse delivery jobs and their proof photos, see
  each job's full chronological scan-event timeline for dispute resolution, and export
  the whole log to CSV.
database: oceanbase

