description: >
  Lotus Driver Tracking System tracks NinjaVan drivers delivering Lotus warehouse
  parcels across Kuala Lumpur. Drivers sign up and log in with email/password, then
  scan each order's barcode at pickup to register it and scan the same barcode again
  at delivery to mark it complete -- every scan logs GPS + timestamp server-side, and
  the barcode itself is an exact identifier so there's no OCR or manual matching
  involved. Supervisors use a Google-SSO-gated admin dashboard to review drivers,
  browse delivery jobs, and see each job's full chronological scan-event timeline for
  dispute resolution.
database: oceanbase

